aid: brl
name: BRL
description: >-
  Crown (brl.xyz) is a Brazilian fintech, backed by Paradigm, Coinbase Ventures
  and Paxos, that issues BRLV — a stablecoin pegged 1:1 to the Brazilian Real
  and backed by Brazilian federal government bonds held in a bankruptcy-remote
  structure under temporary authorization from the Banco Central do Brasil. The
  Crown API lets partners create known-taxpayer accounts and sub-accounts,
  provision wallets, fund balances via PIX and TED, request quotes and place
  conversion orders across fiat (BRL/USD) and tokens (BRLV, wBRLY, USDC, USDT on
  Base and Ethereum mainnet), move tokens on-chain, claim accumulated yield from
  reward certificates (including recurring auto-claims and NFT reward-certificate
  transfers), withdraw via PIX/TED or token, track Brazilian monthly
  tax-exemption progress, and subscribe to webhooks for deposit, order, transfer,
  withdrawal, claim and sub-account approval events. Authentication pairs an
  X-API-Key identifier with a short-lived (<50s) self-signed RS256 JWT that binds
  each request's URI, nonce and SHA-256 body hash.
