- name: deposit
  description: A credit to the account balance via PIX/TED (BRL) or on-chain token, per asset (brl/usd/usdc/usdt).
  id: id
  relationships:
  - belongs_to: account
- name: withdrawal
  description: A payout via fiat (PIX/TED) or token (method token).
  id: id
  relationships:
