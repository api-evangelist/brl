- name: quote
  description: A conversion quote between two assets (fiat or token); consumed to create an order.
  relationships:
  - belongs_to: account
  - has_one: order
    note: A quote is accepted to create an order.
- name: order
  description: A currency-conversion order created by accepting a quote.
  id: id
  relationships:
